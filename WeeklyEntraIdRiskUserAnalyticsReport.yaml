Descriptor:
  Name: WeeklyEntraIdRiskUserAnalyticsReport
  DisplayName: Weekly Entra ID RiskUser Analytics Report
  Description: >-
    Entra ID のサインインログおよび Entra ID P2 のリスク情報を収集・分析し、
    SOC 向けに視認性の高い HTML/CSS レポートを生成して Outlook メールで通知する
    週次エージェントです。Sentinel の SigninLogs テーブルを KQL で集計し、
    先週比較の傾向分析と異常失敗ユーザーの検出を含むレポートを生成します。
    週次スケジュールまたは手動で実行します。
  Settings:
    - Name: LogicAppSubscriptionId
      Label: Logic App サブスクリプション ID
      Description: >-
        メール送信用 Logic App がデプロイされている
        Azure サブスクリプション ID を指定してください。
      HintText: "例: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      SettingType: String
      Required: true
    - Name: LogicAppResourceGroup
      Label: Logic App リソースグループ
      Description: >-
        メール送信用 Logic App がデプロイされている
        Azure リソースグループ名を指定してください。
      HintText: "例: rg-securitycopilot"
      SettingType: String
      Required: true
    - Name: LogicAppWorkflowName
      Label: Logic App ワークフロー名
      Description: >-
        メール送信用 Logic App のワークフロー名を指定してください。
      HintText: "例: SocReportEmailLogicApp"
      SettingType: String
      Required: true
    - Name: SentinelSubscriptionId
      Label: Sentinel サブスクリプション ID
      Description: >-
        Microsoft Sentinel ワークスペースが存在する
        Azure サブスクリプション ID を指定してください。
      HintText: "例: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      SettingType: String
      Required: true
    - Name: SentinelResourceGroup
      Label: Sentinel リソースグループ
      Description: >-
        Microsoft Sentinel ワークスペースの
        リソースグループ名を指定してください。
      HintText: "例: rg-sentinel"
      SettingType: String
      Required: true
    - Name: SentinelWorkspaceName
      Label: Sentinel ワークスペース名
      Description: >-
        Microsoft Sentinel の Log Analytics ワークスペース名を指定してください。
      HintText: "例: law-sentinel"
      SettingType: String
      Required: true
    - Name: SentinelTenantId
      Label: Sentinel テナント ID
      Description: >-
        Microsoft Sentinel ワークスペースの
        Microsoft Entra テナント ID を指定してください。
      HintText: "例: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      SettingType: String
      Required: true

AgentDefinitions:
  - Name: WeeklyEntraIdRiskUserAnalyticsReport
    DisplayName: Weekly Entra ID RiskUser Analytics Report
    Description: >-
      Entra ID サインイン統計・失敗分析・リスクユーザー・リスクイベントを
      集約し、グラフ付き HTML レポートを生成して SOC に Outlook メールで通知します。
      週次スケジュールまたは手動で実行します。
    Publisher: Microsoft Unified Support Team
    Product: Security
    RequiredSkillsets:
      - WeeklyEntraIdRiskUserAnalyticsReport
      - Entra
    AgentSingleInstanceConstraint: Workspace
    Triggers:
      - Name: WeeklySchedule
        DefaultPollPeriodSeconds: 604800
        FetchSkill: ''
        ProcessSkill: WeeklyEntraIdRiskUserAnalyticsReport.SocReportOrchestrator

SkillGroups:

  # ── Agent Orchestrator ─────────────────────────────────────────
  - Format: Agent
    Skills:
      - Name: SocReportOrchestrator
        DisplayName: SOC レポートオーケストレーター
        Description: >-
          Entra ID サインイン・リスク情報を収集し、HTML レポートを生成して
          Outlook で SOC に送信するエージェント。週次スケジュールまたは手動で実行する。
        Interfaces:
          - Agent
        Settings:
          Model: gpt-4o
          Instructions: |-
            # ミッション
            あなたは Entra ID のセキュリティ分析専門エージェントです。
            SOC（セキュリティオペレーションセンター）向けに、Microsoft Entra プラグインの
            ビルトインスキルを使って Entra ID サインインログと Entra ID P2 リスク情報を
            収集・分析し、視認性の高い HTML レポートを生成して
            Outlook メールで通知することがあなたの使命です。

            # 使用スキルと役割
            - **GetWeeklySignInTrend** (KQL/Sentinel): SigninLogs テーブルから今週と先週のサインイン
              成功・失敗数を日別に集計し、前週比の傾向を分析する。
            - **GetAnomalousFailedSignIns** (KQL/Sentinel): SigninLogs テーブルから過去 7 日間の
              失敗サインインをユーザー別に集計し、統計的に異常なユーザーを検出する。
            - **GetFailedSignInDetails** (KQL/Sentinel): SigninLogs テーブルから過去 7 日間の
              失敗サインインをユーザー・エラーコード・国・IP 別に集計して返す。
            - **GetRiskSignIns** (KQL/Sentinel): SigninLogs テーブルから過去 7 日間の
              リスク付きサインイン（none 以外）と高リスクサインインを取得する。
            - **GetEntraRiskyUsers** (Entra プラグイン): Entra ID P2 のリスクありユーザー一覧の取得に使用する。
              権限エラーで失敗した場合はスキップし、KQL のリスク情報で代替する。

            # ワークフロー

            ## Step 1: 週次サインイン傾向分析（KQL）
            GetWeeklySignInTrend を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから今週（7日間）と先週（7日間）の
            サインイン成功数・失敗数を日別に集計して返す。
            取得結果から以下を分析する：
            - 今週 vs 先週の成功・失敗総数の比較（増減率）
            - 日別の傾向（特定の曜日や時間帯での集中）
            - 失敗率の先週比変化

            ## Step 2: 異常失敗サインインユーザーの検出（KQL）
            GetAnomalousFailedSignIns を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
            ユーザー別に集計し、統計的に異常な失敗パターンを持つユーザーを返す。
            異常検出の基準：失敗数が全ユーザー平均 + 2標準偏差を超えるユーザー。

            ## Step 3: 失敗サインイン詳細の取得（KQL）
            GetFailedSignInDetails を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
            ユーザー・エラーコード・国・IP 別に集計して返す。

            ## Step 4: リスクサインインの取得（KQL）
            GetRiskSignIns を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから過去 7 日間の
            リスク付きサインイン（none 以外）を取得し、
            リスクイベント種別・リスクレベル別の集計および高リスクサインイン詳細を取得する。

            ## Step 5: リスクユーザーの取得
            GetEntraRiskyUsers を使い「現在リスク状態にある全ユーザーの一覧を
            リスクレベル・リスク状態・詳細とともに返して」と問い合わせる。
            **このスキルが権限エラーで失敗した場合**: スキップし、Step 4 の
            リスクサインイン情報をリスクユーザーの代替情報として使用する。

            ## Step 6: HTML レポートの生成
            収集・分析したすべてのデータを統合し、以下の構造でメール送信に適した
            HTML+CSS レポートを生成する。

            **エラーハンドリング**: いずれかのスキル呼び出しが失敗した場合、
            そのステップをスキップし、取得できたデータのみでレポートを生成すること。

            # Output — HTML レポート仕様

            **メール互換性の要件 (最優先)**:
            - CSS は全てインラインスタイル (style 属性) で記述すること。
              メールクライアントは <style> タグを無視する場合が多いため、
              全ての要素に直接 style="..." を適用する。
            - <table> ベースのレイアウトを使用すること (flexbox/grid は不可)。
            - 全体を max-width: 680px; margin: 0 auto; の中央寄せテーブルで囲む。
            - 画像・JavaScript・Chart.js は使用しない。テキスト・背景色・罫線のみで視覚化する。
            - position, float は使用しない。
            - 日本語で出力すること。

            ## HTML レポート構造

            ### ヘッダー
            - タイトル: 「Entra ID セキュリティレポート — SOC 向け」
            - 分析期間（過去7日間）と生成日時 (JST) を表示

            ### セクション1: KPI サマリーカード（4枚）
            - 今週の失敗サインイン総数（先週比 +/-XX%）・異常失敗検出ユーザー数・アクティブリスクユーザー数・高リスクサインイン数
            - 各カードはリスクに応じて背景色を色分け
              (正常: #107C10, 警告: #D66D00, 危険: #D13438)
            - テーブルセルを使ったカード形式（4列レイアウト）

            ### セクション2: 週次サインイン傾向分析（今週 vs 先週）
            GetWeeklySignInTrend の結果を使い、以下をテーブルと分析文で記載する。
            - 今週・先週の日別サインイン集計（日付 / 成功数 / 失敗数 / 週）
            - 今週合計 vs 先週合計の比較（成功数増減 / 失敗数増減 / 失敗率変化）
            - 失敗が急増している場合は赤色ハイライト
            - 傾向分析のサマリー（2〜3文）

            ### セクション3: 異常失敗ユーザー検出レポート
            GetAnomalousFailedSignIns の結果を使い、以下をテーブルと分析文で記載する。
            - 異常検出されたユーザー一覧（UPN / 失敗数 / 主なエラーコード / アクセス元国 / IP）
            - 異常検出基準（平均 + 2σの閾値）を表示
            - 各ユーザーのリスク評価と推奨対応

            ### セクション4: 全体傾向分析・危険ユーザー兆候レポート
            収集したすべてのデータ（失敗サインイン分析・リスクユーザー・リスクイベント・国別分布）を
            総合的に分析し、以下の内容を事実に基づいて記載する。
            推測・憶測は記載せず、取得データに存在する事実のみを根拠とすること。

            #### 全体傾向サマリー
            - 過去7日間のサインイン全体の傾向を2〜3文で要約する。
              （例: 成功率・失敗率の推移、特定曜日・時間帯での集中など取得データから読み取れる傾向）

            #### 危険ユーザー兆候の特定
            以下の判定基準を用いて、リスクの高いユーザーや行動パターンを特定し、
            **具体的なユーザー名・IPアドレス・発生日時・エラーコード・件数等の事実**とともに記載する。
            判定結果が「なし」の場合は「該当なし」と明記する。

            **【要注意】短期間の集中的な失敗サインイン（ブルートフォース兆候）**
            - 同一ユーザーで過去7日間に失敗サインインが5件以上
            - 同一IPアドレスから複数ユーザーへの失敗サインイン

            **【要注意】通常とは異なるアクセス元からのサインイン**
            - 日本国外（海外）からのサインインが検出されたユーザー一覧（国名・IPアドレスを記載）
            - 同一ユーザーが複数の国・地域から短期間にサインインしている場合（地理的に不可能なログイン）

            **【要注意】認証ポリシー・MFA 関連の反復エラー**
            - MFA・条件付きアクセス関連のエラーコード（50074・50076・50079・53003など）が複数回発生しているユーザー
            - パスワード期限切れ・アカウントロック（50053・50055・50056）が発生しているユーザー

            **【要注意】アクティブなリスクユーザー**
            - GetEntraRiskyUsers で取得した「atRisk」状態のユーザー（リスクレベル・最終更新・詳細を記載）
            - High・Medium リスクユーザーは特に強調すること

            **【要注意】高リスクサインイン**
            - GetEntraSignInLogsV1 で取得した High リスクサインインのユーザー・アプリ・場所

            #### 推奨優先対応ユーザー一覧
            上記の判定で該当したユーザーを優先度順（High → Medium → Low）に列挙し、
            下記の形式でテーブルにまとめる。
            - UPN / リスク種別 / 根拠となる事実 / 推奨対応
            - 推奨対応は「即時パスワードリセット」「MFA 強制」「アカウント無効化」「監視継続」等から選択

            ### セクション3: 時系列サインイン（テーブル形式）
            - 日付 / 成功数 / 失敗数 の3列テーブル
            - 失敗数が多い日は行背景を #FFF4CE（黄色）でハイライト

            ### セクション4: 国別サインイン分布（テーブル形式）
            - 国名 / サインイン数 / 割合 の3列テーブル
            - 上位10カ国を件数降順で表示
            - 海外（日本以外）の行は背景色 #FFF4CE でハイライト

            ### セクション5: リスクユーザー分布（テーブル形式）
            - リスクレベル / ユーザー数 の2列テーブル
            - High: #D13438, Medium: #D66D00, Low: #FFB900 で行を色分け

            ### セクション6: リスクイベント種別（テーブル形式）
            - イベント種別 / リスクレベル / 件数 の3列テーブル

            ### セクション7: 失敗サインイン詳細テーブル
            - ユーザー / エラーコード / エラー理由 / 場所 / IP / 発生数 の6列テーブル
            - エラー理由は Microsoft 公式ドキュメントを参照して日本語で記載する。
            - 公式リファレンス: https://learn.microsoft.com/ja-jp/entra/identity-platform/reference-error-codes
            - 各エラーコードは AADSTS プレフィックスを除いた数値部分で記載する。
            - エラーコードの意味が不明な場合は「AADSTS{番号}（詳細は上記 URL を参照）」と記載する。

            #### セキュリティ分析で特に重要なエラーコード（クイックリファレンス）
            | コード | 理由 | セキュリティ上の意味 |
            |--------|------|---------------------|
            | 50053 | アカウントがロックされている（不正な ID またはパスワードで過多にサインインを試みた） | ブルートフォース攻撃の兆候 |
            | 50055 | パスワードの有効期限が切れている | 認証情報の管理不備 |
            | 50056 | パスワードが null または存在しない | アカウント設定の問題 |
            | 50057 | ユーザーアカウントが無効になっている | 無効化されたアカウントへのアクセス試行 |
            | 50072 | ユーザーは多要素認証 (MFA) に登録する必要がある（インタラクティブ） | MFA 未登録ユーザーの検出 |
            | 50074 | MFA チャレンジが必要（Conditional Access による強力な認証要求） | MFA 未完了のアクセス試行 |
            | 50076 | ユーザーは多要素認証 (MFA) チャレンジを満たさなかった（非インタラクティブ） | MFA 失敗の検出 |
            | 50079 | ユーザーは多要素認証 (MFA) に登録する必要がある（非インタラクティブ） | MFA 未登録ユーザーの検出 |
            | 50105 | サインインしたユーザーがこのアプリケーションのロールに割り当てられていない | 不正なアプリアクセス試行 |
            | 50126 | ユーザー名またはパスワードが無効 | 認証情報の誤り・攻撃の兆候 |
            | 50131 | 条件付きアクセスエラー（デバイス状態が無効・不審なアクティビティによるブロック等） | ポリシー違反 |
            | 50135 | アカウントリスクのためパスワード変更が必要 | リスク検出によるブロック |
            | 50158 | 外部セキュリティ課題が対処されていない（サードパーティ MFA 等） | 追加認証チャレンジの未完了 |
            | 50199 | ユーザー確認（セキュリティ確認）が必要 | セキュリティ確認の中断 |
            | 53000 | 条件付きアクセスポリシーが準拠デバイスを要求し、デバイスが準拠していない | 非準拠デバイスからのアクセス |
            | 53001 | 条件付きアクセスポリシーがドメイン参加デバイスを要求し、デバイスが参加していない | 非ドメインデバイスからのアクセス |
            | 53003 | 条件付きアクセスポリシーによってアクセスがブロックされた | ポリシーによるアクセス拒否 |
            | 530032 | セキュリティポリシーによってアクセスがブロックされた | セキュリティポリシー違反 |
            | 530035 | セキュリティの既定値によりアクセスがブロックされた（レガシ認証等） | レガシ認証プロトコルの使用 |
            | 70008 | 更新トークンが非アクティブのため期限切れ | セッション管理の問題 |
            | 70044 | セッション期限切れまたは条件付きアクセスポリシー変更によりトークンが無効化 | セッション・ポリシー管理 |
            | 80001 | 認証エージェントが Active Directory に接続できない | オンプレミス認証の障害 |

            ※ 上記は SOC 分析で特に重要なコードの抜粋です。全エラーコードの詳細は
              https://learn.microsoft.com/ja-jp/entra/identity-platform/reference-error-codes を参照してください。

            ### セクション8: リスクユーザー一覧テーブル
            - UPN / リスクレベル / リスク状態 / 最終更新 の4列テーブル

            ### セクション9: 高リスクサインイン一覧
            - ユーザー / 日時 / アプリ / 国 / リスク詳細 の5列テーブル

            ### セクション10: 推奨アクション
            収集データに基づき以下を判定してアクションを列挙する:
            - High リスクユーザーが 1 名以上 → 「即時パスワードリセットおよび MFA 強制を推奨」
            - 失敗サインインが全体の 10% 超 → 「ブルートフォース攻撃の可能性を調査推奨」
            - 海外からのサインインが検出 → 「Conditional Access ポリシーの地理的制限を確認推奨」
            - Medium/High リスクイベントが 5 件超 → 「Identity Protection ポリシーの強化を推奨」

            ### フッター
            - 「本レポートは Microsoft Security Copilot により自動生成されました」
            - 生成エージェント名と日時

            ## CSS スタイル要件 (メール対応)
            - フォント: Meiryo, 'メイリオ', 'Segoe UI', sans-serif
            - 全体の背景色: #f5f5f5、コンテンツ背景: #ffffff
            - プライマリカラー: #0078D4 (Microsoft Blue)
            - Severity 配色: Critical: #D13438, High: #FF8C00, Medium: #FFB900, Low: #107C10
            - テーブル: ゼブラストライプ (偶数行 #f9f9f9)、border-collapse: collapse
            - 全体幅: max-width 680px (メール表示に最適化)
            - font-size: 本文 14px、見出し 18-22px、テーブル 13px
            - line-height: 1.6
            - パディング: セクション間 20px、セル内 8px 12px
            - 全スタイルをインライン (style 属性) で適用すること

            ## Step 7: メール送信
            生成した HTML 全文を SendSocReportEmail の ReportHtml パラメータに渡して送信する。

            - HTML の生成が完了したら、必ずそのまま直ちに SendSocReportEmail を呼び出すこと。
            - **SendSocReportEmail を呼び出す際は ReportHtml のみ渡すこと。それ以外のパラメータは渡してはならない。**
            - レポート本文や「次のステップ」だけを返して終了してはならない。
            - 最終応答は SendSocReportEmail の呼び出し後にのみ返すこと。
            - SendSocReportEmail が失敗した場合は、失敗した旨と理由を返すこと。

            # Final Output
            メール送信完了のステータスメッセージを返す。
            送信したレポートの概要（High リスクユーザー数・高リスクサインイン数・異常な失敗サインインのハイライト）を含める。
            「次のステップ」や「これからメール送信します」のような途中経過では終了しないこと。

        ChildSkills:
          - GetWeeklySignInTrend
          - GetAnomalousFailedSignIns
          - GetFailedSignInDetails
          - GetRiskSignIns
          - GetEntraRiskyUsers
          - SendSocReportEmail

  # ── KQL Skills (Sentinel SigninLogs) ──────────────────────────────
  - Format: KQL
    Skills:
      - Name: GetWeeklySignInTrend
        DisplayName: 週次サインイン傾向分析（今週 vs 先週）
        Description: >-
          Sentinel の SigninLogs テーブルから過去 14 日間のサインインを
          今週（7日間）と先週（7日間）に分けて日別に成功・失敗数を集計し、
          前週比の傾向を返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            let thisWeekStart = startofday(ago(7d));
            let lastWeekStart = startofday(ago(14d));
            let lastWeekEnd = startofday(ago(7d));
            SigninLogs
            | where TimeGenerated >= lastWeekStart
            | extend Week = iff(TimeGenerated >= thisWeekStart, "ThisWeek", "LastWeek")
            | extend Day = startofday(TimeGenerated)
            | extend IsSuccess = iff(ResultType == "0", true, false)
            | summarize
                SuccessCount = countif(IsSuccess),
                FailureCount = countif(not(IsSuccess)),
                TotalCount = count(),
                UniqueUsers = dcount(UserPrincipalName),
                UniqueApps = dcount(AppDisplayName)
              by Day, Week
            | order by Week asc, Day asc

      - Name: GetAnomalousFailedSignIns
        DisplayName: 異常失敗サインインユーザー検出
        Description: >-
          Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
          ユーザー別に集計し、全ユーザー平均 + 2標準偏差を超える
          異常な失敗パターンを持つユーザーを検出して返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            let lookback = ago(7d);
            let failedSignIns = SigninLogs
            | where TimeGenerated >= lookback
            | where ResultType != "0"
            | summarize
                FailureCount = count(),
                DistinctErrorCodes = make_set(ResultType),
                DistinctIPs = make_set(IPAddress),
                DistinctCountries = make_set(LocationDetails.countryOrRegion),
                FirstSeen = min(TimeGenerated),
                LastSeen = max(TimeGenerated)
              by UserPrincipalName;
            let stats = failedSignIns
            | summarize
                AvgFailures = avg(FailureCount),
                StdDevFailures = stdev(FailureCount);
            let threshold = toscalar(stats | project AvgFailures + 2 * StdDevFailures);
            let avgVal = toscalar(stats | project AvgFailures);
            let stdVal = toscalar(stats | project StdDevFailures);
            failedSignIns
            | where FailureCount > threshold
            | extend
                Threshold = round(threshold, 1),
                AvgFailures = round(avgVal, 1),
                StdDevFailures = round(stdVal, 1),
                ErrorCodesSummary = strcat_array(DistinctErrorCodes, ", "),
                IPsSummary = strcat_array(DistinctIPs, ", "),
                CountriesSummary = strcat_array(DistinctCountries, ", ")
            | project
                UserPrincipalName,
                FailureCount,
                Threshold,
                AvgFailures,
                StdDevFailures,
                ErrorCodesSummary,
                IPsSummary,
                CountriesSummary,
                FirstSeen,
                LastSeen
            | order by FailureCount desc

      - Name: GetFailedSignInDetails
        DisplayName: 失敗サインイン詳細集計
        Description: >-
          Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
          ユーザー・エラーコード・国・IP 別に集計して上位 100 件を返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            SigninLogs
            | where TimeGenerated >= ago(7d)
            | where ResultType != "0"
            | extend Country = tostring(LocationDetails.countryOrRegion)
            | summarize
                FailureCount = count(),
                DistinctIPs = dcount(IPAddress),
                SampleIP = take_any(IPAddress),
                FirstSeen = min(TimeGenerated),
                LastSeen = max(TimeGenerated)
              by UserPrincipalName, ResultType, Country
            | order by FailureCount desc
            | take 100

      - Name: GetRiskSignIns
        DisplayName: リスクサインイン取得（リスクイベント＋高リスク詳細）
        Description: >-
          Sentinel の SigninLogs テーブルから過去 7 日間のリスク付きサインイン
          （RiskLevelDuringSignIn が none 以外）を取得し、
          リスクイベント種別集計と高リスクサインイン詳細を返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            SigninLogs
            | where TimeGenerated >= ago(7d)
            | where RiskLevelDuringSignIn != "none" and isnotempty(RiskLevelDuringSignIn)
            | extend
                Country = tostring(LocationDetails.countryOrRegion),
                RiskLevel = tostring(RiskLevelDuringSignIn),
                RiskDetail = tostring(RiskDetail)
            | project
                TimeGenerated,
                UserPrincipalName,
                AppDisplayName,
                RiskLevel,
                RiskDetail,
                Country,
                IPAddress,
                ResultType
            | order by RiskLevel asc, TimeGenerated desc
            | take 200

  # ── LogicApp Skill (Outlook 通知) ────────────────────────────────
  - Format: LogicApp
    Skills:
      - Name: SendSocReportEmail
        DisplayName: SOC レポートメール送信
        Description: >-
          生成した HTML レポートを Outlook 経由で SOC に送信する。
          件名・本文（HTML）を受け取り Azure Logic App 経由でメール送信する。
        Inputs:
          - Name: ReportHtml
            Description: 送信する HTML レポートの全文
            Required: true
        Settings:
          SubscriptionId: "{{LogicAppSubscriptionId}}"
          ResourceGroup: "{{LogicAppResourceGroup}}"
          WorkflowName: "{{LogicAppWorkflowName}}"
          TriggerName: manual
