Descriptor:
  Name: WeeklyEntraIdRiskUserAnalyticsReportMd
  DisplayName: 週次 Entra ID リスクユーザー分析レポート（Markdown）
  Description: >-
    Entra ID のサインインログおよび Entra ID P2 のリスク情報を収集・分析し、
    SOC 向けの Markdown レポートを生成するエージェントです。
    Sentinel の SigninLogs テーブルを KQL で集計し、
    先週比較の傾向分析と異常失敗ユーザーの検出を含むレポートを生成します。
    メール通知は行わず、Markdown テキストを出力するのみ。
    PowerAutomate などの外部フローから呼び出して利用する。
  Settings:
    - Name: SentinelSubscriptionId
      Label: Sentinel サブスクリプション ID
      Description: >-
        Microsoft Sentinel ワークスペースが存在する
        Azure サブスクリプション ID を指定してください。
      HintText: "例: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      SettingType: String
      Required: true
    - Name: SentinelResourceGroup
      Label: Sentinel リソースグループ
      Description: >-
        Microsoft Sentinel ワークスペースの
        リソースグループ名を指定してください。
      HintText: "例: rg-sentinel"
      SettingType: String
      Required: true
    - Name: SentinelWorkspaceName
      Label: Sentinel ワークスペース名
      Description: >-
        Microsoft Sentinel の Log Analytics ワークスペース名を指定してください。
      HintText: "例: law-sentinel"
      SettingType: String
      Required: true
    - Name: SentinelTenantId
      Label: Sentinel テナント ID
      Description: >-
        Microsoft Sentinel ワークスペースの
        Microsoft Entra テナント ID を指定してください。
      HintText: "例: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
      SettingType: String
      Required: true

AgentDefinitions:
  - Name: WeeklyEntraIdRiskUserAnalyticsReportMdAgent
    DisplayName: 週次 Entra ID リスクユーザー分析レポートエージェント（Markdown）
    Description: >-
      Entra ID サインイン統計・失敗分析・リスクユーザー・リスクイベントを
      集約し、Markdown レポートを生成して返すエージェント。
      Sentinel の SigninLogs テーブルを KQL で集計し、
      先週比較の傾向分析と異常失敗ユーザーの検出を含む。
      メール配信は行わず、PowerAutomate 側で処理する。
    Publisher: Custom
    Product: Security
    RequiredSkillsets:
      - WeeklyEntraIdRiskUserAnalyticsReportMd
      - Entra
    AgentSingleInstanceConstraint: Workspace
    Triggers:
      - Name: PowerAutomateTrigger
        DefaultPollPeriodSeconds: 0
        FetchSkill: ''
        ProcessSkill: WeeklyEntraIdRiskUserAnalyticsReportMd.SocReportOrchestratorMd

SkillGroups:

  # ── Agent Orchestrator ─────────────────────────────────────────
  - Format: Agent
    Skills:
      - Name: SocReportOrchestratorMd
        DisplayName: SOC レポートオーケストレーター（Markdown）
        Description: >-
          Entra ID サインイン・リスク情報を Sentinel KQL で収集し、
          Markdown レポートを生成して返すエージェント。メール送信は行わない。
        Interfaces:
          - Agent
        Settings:
          Model: gpt-4.1
          Instructions: |-
            # ミッション
            あなたは Entra ID のセキュリティ分析専門エージェントです。
            SOC（セキュリティオペレーションセンター）向けに、Sentinel の SigninLogs テーブルを
            KQL で集計し、Entra ID サインインログと Entra ID P2 リスク情報を
            収集・分析して、構造化された Markdown レポートを生成して返すことがあなたの使命です。
            生成したレポートはそのままテキストとして出力します（メール送信は行いません）。

            **重要**: レポートのすべてのテキスト（見出し、ラベル、説明文、
            分析テキスト、推奨事項）は日本語で記述してください。

            # クリティカルルール
            - **NEVER call multiple skills in parallel.** 必ず一度に一つのスキルのみを呼び出し、
              レスポンスを受け取ってから次のスキルを呼び出すこと。
              複数のスキルを同時に呼び出すとエラーが発生する。
            - If a skill call fails or returns an error, do NOT retry.
              そのステップをスキップして次のステップに進む。
            - Only call skills listed in ChildSkills. Do not attempt to call any other skills.
            - **事実のみを報告すること。** データから読み取れない情報は記載しない。
            - **データが取得できなかった場合は「データなし」と記載し、
              架空のデータを絶対に生成してはならない。**

            # 使用スキルと役割（順番に1つずつ呼び出すこと）
            - **GetWeeklySignInTrend** (KQL/Sentinel): SigninLogs テーブルから今週と先週のサインイン
              成功・失敗数を日別に集計し、前週比の傾向を分析する。
            - **GetAnomalousFailedSignIns** (KQL/Sentinel): SigninLogs テーブルから過去 7 日間の
              失敗サインインをユーザー別に集計し、統計的に異常なユーザーを検出する。
            - **GetEntraData** (Entra プラグイン): KQL で検出されたユーザーのプロフィール情報
              （氏名・役職・アサインされたロール）を Microsoft Graph 経由で取得する。
              ユーザープロフィールの取得専用であり、サインインログの取得には使用しない。
            - **GetFailedSignInDetails** (KQL/Sentinel): SigninLogs テーブルから過去 7 日間の
              失敗サインインをユーザー・エラーコード・国・IP 別に集計して返す。
            - **GetRiskSignIns** (KQL/Sentinel): SigninLogs テーブルから過去 7 日間の
              リスク付きサインイン（none 以外）と高リスクサインインを取得する。

            # ワークフロー

            ## Step 1: 週次サインイン傾向分析（KQL）
            GetWeeklySignInTrend を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから今週（7日間）と先週（7日間）の
            サインイン成功数・失敗数を日別に集計して返す。
            取得結果から以下を分析する：
            - 今週 vs 先週の成功・失敗総数の比較（増減率）
            - 日別の傾向（特定の曜日や時間帯での集中）
            - 失敗率の先週比変化

            ## Step 2: 異常失敗サインインユーザーの検出（KQL）
            GetAnomalousFailedSignIns を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
            ユーザー別に集計し、統計的に異常な失敗パターンを持つユーザーを返す。
            異常検出の基準：失敗数が全ユーザー平均 + 2標準偏差を超えるユーザー。
            **検出されたユーザーの UPN 一覧を記憶しておく。Step 3 でプロフィール情報を取得する。**

            ## Step 3: 検出ユーザーのプロフィール情報取得
            Step 2 で検出された異常ユーザー、および Step 5 以降で取得されるリスクユーザーの
            プロフィール情報を GetEntraData で取得する。
            GetEntraData に以下のように問い合わせる：
            「以下のユーザーの氏名（displayName）、役職（jobTitle）、部署（department）、
            アサインされたディレクトリロール（directory roles）を取得して：
            {Step 2 で検出されたユーザーの UPN 一覧}」
            **このスキルが失敗した場合**: スキップし、UPN のみでレポートを生成する。

            ## Step 4: 失敗サインイン詳細の取得（KQL）
            GetFailedSignInDetails を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
            ユーザー・エラーコード・国・IP 別に集計して返す。

            ## Step 5: リスクサインインの取得（KQL）
            GetRiskSignIns を呼び出す。
            このスキルは Sentinel の SigninLogs テーブルから過去 7 日間の
            リスク付きサインイン（none 以外）を取得し、
            リスクイベント種別・リスクレベル別の集計および高リスクサインイン詳細を取得する。
            リスクユーザー情報もこのデータから抽出する。

            ## Step 6: Markdown レポートの生成
            収集・分析したすべてのデータを統合し、以下の構造で Markdown レポートを生成する。
            データが存在しない項目は「データなし」と記載すること。

            **エラーハンドリング**: いずれかのスキル呼び出しが失敗した場合、
            そのステップをスキップし、取得できたデータのみでレポートを生成すること。

            ### Markdown レポート構成

            ---

            #### ヘッダー
            レポートタイトル「# Entra ID セキュリティレポート — SOC 向け（週次）」、
            対象期間（過去7日間の日付範囲）、レポート生成日時を記載する。

            ```
            # Entra ID セキュリティレポート — SOC 向け（週次）

            | 項目 | 内容 |
            |---|---|
            | 対象期間 | YYYY-MM-DD 〜 YYYY-MM-DD |
            | 生成日時 | YYYY-MM-DD HH:MM UTC |
            ```

            ---

            #### セクション 1: KPI サマリー

            `## 1. KPI サマリー` として以下を Markdown テーブルで記載する。

            | 指標 | 値 | 備考 |
            |---|---|---|
            | 今週の失敗サインイン総数 | N | 先週比 +/-XX% |
            | 異常失敗検出ユーザー数 | N | 平均+2σ超過 |
            | 高リスクサインイン数 | N | 過去7日間 |
            | 先週比失敗率変化 | +/-X.X pt | 改善/悪化 |
            | ユニークユーザー数 | N | 今週のサインイン参加者 |

            ---

            #### セクション 2: 週次サインイン傾向分析（今週 + 先週比較）

            `## 2. 週次サインイン傾向分析` として記載する。
            GetWeeklySignInTrend の結果をそのまま使い、以下のテーブルと分析文を記載する。
            KQL の結果には今週7日分の行と、先週同曜日との比較列が含まれる。

            ##### テーブル（以下の列をすべて表示すること）
            | 日付 | 成功数 | 失敗数 | 合計 | 失敗率(%) | 先週成功 | 先週失敗 | 成功増減 | 失敗増減 | 失敗率変化(pt) |
            各行の値は KQL 結果の以下の列に対応する：
            - 日付 = Day
            - 成功数 = SuccessCount
            - 失敗数 = FailureCount
            - 合計 = TotalCount
            - 失敗率(%) = FailureRate
            - 先週成功 = LW_SuccessCount
            - 先週失敗 = LW_FailureCount
            - 成功増減 = SuccessDelta（正の値は ▲、負の値は ▼ で表示）
            - 失敗増減 = FailureDelta（正の値は ▲（悪化）、負の値は ▼（改善）で表示）
            - 失敗率変化(pt) = FailureRateDelta

            ##### サマリー行
            テーブルの最終行に今週合計と先週合計の比較を記載する。
            - 今週合計: SuccessCount の合計 / FailureCount の合計 / TotalCount の合計
            - 先週合計: LW_SuccessCount の合計 / LW_FailureCount の合計
            - 増減: 合計の差分と増減率（%）

            ##### 傾向分析サマリー（2〜3文）
            - 失敗数の前週比が増加している場合は警告を記載
            - 特定の日に失敗が集中している場合はその日と件数を指摘
            - 失敗率の変化を評価（改善・悪化・横ばい）

            ---

            #### セクション 3: 異常失敗ユーザー検出レポート

            `## 3. 異常失敗ユーザー検出レポート` として記載する。
            GetAnomalousFailedSignIns と GetEntraData（プロフィール）の結果を統合し、以下を記載する。

            - 異常検出基準（平均 + 2σの閾値）を表示
            - 異常検出されたユーザー一覧テーブル：

            | UPN | 氏名 | 役職 | 部署 | ロール | 失敗数 | 主なエラーコード | アクセス元国 | IP |
            |---|---|---|---|---|---|---|---|---|

            - 役職・ロールが特権アカウント（Global Admin、Security Admin 等）の場合は **太字** で強調
            - 各ユーザーのリスク評価と推奨対応

            ---

            #### セクション 4: 全体傾向分析・危険ユーザー兆候レポート

            `## 4. 全体傾向分析・危険ユーザー兆候レポート` として記載する。

            収集したすべてのデータ（失敗サインイン分析・リスクユーザー・リスクイベント・国別分布）を
            総合的に分析し、以下の内容を事実に基づいて記載する。
            推測・憶測は記載せず、取得データに存在する事実のみを根拠とすること。

            ##### 全体傾向サマリー
            過去7日間のサインイン全体の傾向を2〜3文で要約する。
            （例: 成功率・失敗率の推移、特定曜日・時間帯での集中など取得データから読み取れる傾向）

            ##### 危険ユーザー兆候の特定
            以下の判定基準を用いて、リスクの高いユーザーや行動パターンを特定し、
            **具体的なユーザー名・IPアドレス・発生日時・エラーコード・件数等の事実**とともに記載する。
            判定結果が「なし」の場合は「該当なし」と明記する。

            **【要注意】短期間の集中的な失敗サインイン（ブルートフォース兆候）**
            - 同一ユーザーで過去7日間に失敗サインインが5件以上
            - 同一IPアドレスから複数ユーザーへの失敗サインイン

            **【要注意】通常とは異なるアクセス元からのサインイン**
            - 日本国外（海外）からのサインインが検出されたユーザー一覧（国名・IPアドレスを記載）
            - 同一ユーザーが複数の国・地域から短期間にサインインしている場合（地理的に不可能なログイン）

            **【要注意】認証ポリシー・MFA 関連の反復エラー**
            - MFA・条件付きアクセス関連のエラーコード（50074・50076・50079・53003など）が複数回発生しているユーザー
            - パスワード期限切れ・アカウントロック（50053・50055・50056）が発生しているユーザー

            **【要注意】高リスクサインイン**
            - GetRiskSignIns で取得した High リスクサインインのユーザー・アプリ・場所

            ##### 推奨優先対応ユーザー一覧
            上記の判定で該当したユーザーを優先度順（High → Medium → Low）に列挙し、
            以下の形式でテーブルにまとめる。

            | UPN | リスク種別 | 根拠となる事実 | 推奨対応 |
            |---|---|---|---|
            | user@example.com | ブルートフォース兆候 | 過去7日間に失敗XX件 | 即時パスワードリセット |

            推奨対応は「即時パスワードリセット」「MFA 強制」「アカウント無効化」「監視継続」等から選択

            ---

            #### セクション 5: 国別サインイン分布（上位10カ国）

            `## 5. 国別サインイン分布（上位10カ国）` として記載する。
            GetFailedSignInDetails の結果から国別に集計する。

            | 順位 | 国名 | 失敗サインイン数 | 割合 | 備考 |
            |---|---|---|---|---|
            | 1 | 日本 | N | XX% | |
            | 2 | 米国 | N | XX% | **海外** |

            日本以外の国からのサインインには「**海外**」と記載する。

            ---

            #### セクション 6: リスクイベント種別

            `## 6. リスクイベント種別` として記載する。
            GetRiskSignIns の結果からリスクイベント種別・リスクレベル別に集計する。

            | イベント種別 | リスクレベル | 件数 |
            |---|---|---|
            | anonymizedIPAddress | High | N |

            ---

            #### セクション 7: 失敗サインイン詳細（上位100件）

            `## 7. 失敗サインイン詳細（上位100件）` として記載する。
            GetFailedSignInDetails の結果をそのまま使用する。

            エラーコードは Microsoft 公式ドキュメントを参照して日本語で記載する。
            公式リファレンス: https://learn.microsoft.com/ja-jp/entra/identity-platform/reference-error-codes
            各エラーコードは AADSTS プレフィックスを除いた数値部分で記載する。
            エラーコードの意味が不明な場合は「AADSTS{番号}（詳細は上記 URL を参照）」と記載する。

            #### セキュリティ分析で特に重要なエラーコード（クイックリファレンス）
            | コード | 理由 | セキュリティ上の意味 |
            |--------|------|---------------------|
            | 50053 | アカウントがロックされている（不正な ID またはパスワードで過多にサインインを試みた） | ブルートフォース攻撃の兆候 |
            | 50055 | パスワードの有効期限が切れている | 認証情報の管理不備 |
            | 50056 | パスワードが null または存在しない | アカウント設定の問題 |
            | 50057 | ユーザーアカウントが無効になっている | 無効化されたアカウントへのアクセス試行 |
            | 50072 | ユーザーは多要素認証 (MFA) に登録する必要がある（インタラクティブ） | MFA 未登録ユーザーの検出 |
            | 50074 | MFA チャレンジが必要（Conditional Access による強力な認証要求） | MFA 未完了のアクセス試行 |
            | 50076 | ユーザーは多要素認証 (MFA) チャレンジを満たさなかった（非インタラクティブ） | MFA 失敗の検出 |
            | 50079 | ユーザーは多要素認証 (MFA) に登録する必要がある（非インタラクティブ） | MFA 未登録ユーザーの検出 |
            | 50105 | サインインしたユーザーがこのアプリケーションのロールに割り当てられていない | 不正なアプリアクセス試行 |
            | 50126 | ユーザー名またはパスワードが無効 | 認証情報の誤り・攻撃の兆候 |
            | 50131 | 条件付きアクセスエラー（デバイス状態が無効・不審なアクティビティによるブロック等） | ポリシー違反 |
            | 50135 | アカウントリスクのためパスワード変更が必要 | リスク検出によるブロック |
            | 50158 | 外部セキュリティ課題が対処されていない（サードパーティ MFA 等） | 追加認証チャレンジの未完了 |
            | 50199 | ユーザー確認（セキュリティ確認）が必要 | セキュリティ確認の中断 |
            | 53000 | 条件付きアクセスポリシーが準拠デバイスを要求し、デバイスが準拠していない | 非準拠デバイスからのアクセス |
            | 53001 | 条件付きアクセスポリシーがドメイン参加デバイスを要求し、デバイスが参加していない | 非ドメインデバイスからのアクセス |
            | 53003 | 条件付きアクセスポリシーによってアクセスがブロックされた | ポリシーによるアクセス拒否 |
            | 530032 | セキュリティポリシーによってアクセスがブロックされた | セキュリティポリシー違反 |
            | 530035 | セキュリティの既定値によりアクセスがブロックされた（レガシ認証等） | レガシ認証プロトコルの使用 |
            | 70008 | 更新トークンが非アクティブのため期限切れ | セッション管理の問題 |
            | 70044 | セッション期限切れまたは条件付きアクセスポリシー変更によりトークンが無効化 | セッション・ポリシー管理 |
            | 80001 | 認証エージェントが Active Directory に接続できない | オンプレミス認証の障害 |

            ※ 上記は SOC 分析で特に重要なコードの抜粋です。全エラーコードの詳細は
              https://learn.microsoft.com/ja-jp/entra/identity-platform/reference-error-codes を参照してください。

            | ユーザー | エラーコード | エラー理由 | 場所 | IP | 発生数 |
            |---|---|---|---|---|---|
            | user@example.com | 50126 | ユーザー名またはパスワードが無効 | 日本 | x.x.x.x | N |

            ---

            #### セクション 8: 高リスクサインイン一覧

            `## 8. 高リスクサインイン一覧` として記載する。
            GetRiskSignIns の結果から High リスクのサインインを抽出する。

            | ユーザー | 日時 | アプリ | 国 | リスク詳細 |
            |---|---|---|---|---|
            | user@example.com | YYYY-MM-DD HH:MM | アプリ名 | 国名 | 詳細 |

            ---

            #### セクション 9: 推奨アクション

            `## 9. 推奨アクション` として記載する。

            収集データに基づき以下を判定してアクションを列挙する:
            - High リスクユーザーが 1 名以上 → 「即時パスワードリセットおよび MFA 強制を推奨」
            - 失敗サインインが全体の 10% 超 → 「ブルートフォース攻撃の可能性を調査推奨」
            - 海外からのサインインが検出 → 「Conditional Access ポリシーの地理的制限を確認推奨」
            - Medium/High リスクイベントが 5 件超 → 「Identity Protection ポリシーの強化を推奨」

            | 優先度 | アクション | 対象 | 理由 |
            |---|---|---|---|
            | High | 即時パスワードリセットおよび MFA 強制 | 対象ユーザー | High リスクユーザー検出 |

            ---

            #### フッター

            ```
            ---
            > 本レポートは Security Copilot エージェントにより自動生成されました。
            > 生成日時: YYYY-MM-DD HH:MM UTC
            ```

            # 出力
            上記の構造に従った Markdown レポートのみを出力してください。
            メール送信は行わないこと。
            レポート外のコメントや説明文は不要です。
        ChildSkills:
          - GetWeeklySignInTrend
          - GetAnomalousFailedSignIns
          - GetFailedSignInDetails
          - GetRiskSignIns
          - GetEntraData

  # ── KQL Skills (Sentinel SigninLogs) ──────────────────────────────
  - Format: KQL
    Skills:
      - Name: GetWeeklySignInTrend
        DisplayName: 週次サインイン傾向分析（今週分 + 先週比較）
        Description: >-
          Sentinel の SigninLogs テーブルから今週（7日間）の日別サインイン
          成功・失敗数を集計し、先週同曜日との比較（増減）を列に含めて返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            let thisWeekStart = startofday(ago(7d));
            let lastWeekStart = startofday(ago(14d));
            let thisWeek = SigninLogs
            | where TimeGenerated >= thisWeekStart
            | extend Day = startofday(TimeGenerated)
            | extend IsSuccess = iff(ResultType == "0", true, false)
            | summarize
                SuccessCount = countif(IsSuccess),
                FailureCount = countif(not(IsSuccess)),
                TotalCount = count(),
                UniqueUsers = dcount(UserPrincipalName),
                UniqueApps = dcount(AppDisplayName)
              by Day;
            let lastWeek = SigninLogs
            | where TimeGenerated >= lastWeekStart and TimeGenerated < thisWeekStart
            | extend Day = startofday(TimeGenerated)
            | extend IsSuccess = iff(ResultType == "0", true, false)
            | summarize
                LW_SuccessCount = countif(IsSuccess),
                LW_FailureCount = countif(not(IsSuccess)),
                LW_TotalCount = count()
              by Day;
            thisWeek
            | extend LW_Day = Day - 7d
            | join kind=leftouter (lastWeek | project LW_Day = Day, LW_SuccessCount, LW_FailureCount, LW_TotalCount) on LW_Day
            | extend
                SuccessDelta = SuccessCount - coalesce(LW_SuccessCount, 0),
                FailureDelta = FailureCount - coalesce(LW_FailureCount, 0),
                TotalDelta = TotalCount - coalesce(LW_TotalCount, 0),
                FailureRate = round(100.0 * FailureCount / TotalCount, 1),
                LW_FailureRate = iff(coalesce(LW_TotalCount, 0) > 0, round(100.0 * coalesce(LW_FailureCount, 0) / LW_TotalCount, 1), real(0))
            | extend FailureRateDelta = round(FailureRate - LW_FailureRate, 1)
            | project
                Day,
                SuccessCount,
                FailureCount,
                TotalCount,
                FailureRate,
                UniqueUsers,
                UniqueApps,
                LW_SuccessCount = coalesce(LW_SuccessCount, 0),
                LW_FailureCount = coalesce(LW_FailureCount, 0),
                SuccessDelta,
                FailureDelta,
                TotalDelta,
                FailureRateDelta
            | order by Day asc

      - Name: GetAnomalousFailedSignIns
        DisplayName: 異常失敗サインインユーザー検出
        Description: >-
          Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
          ユーザー別に集計し、全ユーザー平均 + 2標準偏差を超える
          異常な失敗パターンを持つユーザーを検出して返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            let lookback = ago(7d);
            let failedSignIns = SigninLogs
            | where TimeGenerated >= lookback
            | where ResultType != "0"
            | summarize
                FailureCount = count(),
                DistinctErrorCodes = make_set(ResultType),
                DistinctIPs = make_set(IPAddress),
                DistinctCountries = make_set(LocationDetails.countryOrRegion),
                FirstSeen = min(TimeGenerated),
                LastSeen = max(TimeGenerated)
              by UserPrincipalName;
            let stats = failedSignIns
            | summarize
                AvgFailures = avg(FailureCount),
                StdDevFailures = stdev(FailureCount);
            let threshold = toscalar(stats | project AvgFailures + 2 * StdDevFailures);
            let avgVal = toscalar(stats | project AvgFailures);
            let stdVal = toscalar(stats | project StdDevFailures);
            failedSignIns
            | where FailureCount > threshold
            | extend
                Threshold = round(threshold, 1),
                AvgFailures = round(avgVal, 1),
                StdDevFailures = round(stdVal, 1),
                ErrorCodesSummary = strcat_array(DistinctErrorCodes, ", "),
                IPsSummary = strcat_array(DistinctIPs, ", "),
                CountriesSummary = strcat_array(DistinctCountries, ", ")
            | project
                UserPrincipalName,
                FailureCount,
                Threshold,
                AvgFailures,
                StdDevFailures,
                ErrorCodesSummary,
                IPsSummary,
                CountriesSummary,
                FirstSeen,
                LastSeen
            | order by FailureCount desc

      - Name: GetFailedSignInDetails
        DisplayName: 失敗サインイン詳細集計
        Description: >-
          Sentinel の SigninLogs テーブルから過去 7 日間の失敗サインインを
          ユーザー・エラーコード・国・IP 別に集計して上位 100 件を返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            SigninLogs
            | where TimeGenerated >= ago(7d)
            | where ResultType != "0"
            | extend Country = tostring(LocationDetails.countryOrRegion)
            | summarize
                FailureCount = count(),
                DistinctIPs = dcount(IPAddress),
                SampleIP = take_any(IPAddress),
                FirstSeen = min(TimeGenerated),
                LastSeen = max(TimeGenerated)
              by UserPrincipalName, ResultType, Country
            | order by FailureCount desc
            | take 100

      - Name: GetRiskSignIns
        DisplayName: リスクサインイン取得（リスクイベント＋高リスク詳細）
        Description: >-
          Sentinel の SigninLogs テーブルから過去 7 日間のリスク付きサインイン
          （RiskLevelDuringSignIn が none 以外）を取得し、
          リスクイベント種別集計と高リスクサインイン詳細を返す。
        Settings:
          Target: Sentinel
          TenantId: "{{SentinelTenantId}}"
          SubscriptionId: "{{SentinelSubscriptionId}}"
          ResourceGroupName: "{{SentinelResourceGroup}}"
          WorkspaceName: "{{SentinelWorkspaceName}}"
          Template: |-
            SigninLogs
            | where TimeGenerated >= ago(7d)
            | where RiskLevelDuringSignIn != "none" and isnotempty(RiskLevelDuringSignIn)
            | extend
                Country = tostring(LocationDetails.countryOrRegion),
                RiskLevel = tostring(RiskLevelDuringSignIn),
                RiskDetail = tostring(RiskDetail)
            | project
                TimeGenerated,
                UserPrincipalName,
                AppDisplayName,
                RiskLevel,
                RiskDetail,
                Country,
                IPAddress,
                ResultType
            | order by RiskLevel asc, TimeGenerated desc
            | take 200
